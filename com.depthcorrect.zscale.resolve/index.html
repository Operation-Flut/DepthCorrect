<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
    <title>DepthCorrect</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="panel">
        <header class="header">
            <div>
                <h1>DepthCorrect</h1>
                <p>Live depth-based scale correction for Fusion 3D</p>
            </div>
            <button id="scan" class="secondary">Scan composition</button>
        </header>

        <section class="settings" aria-label="Correction settings">
            <label for="reference">Reference distance</label>
            <div class="number-field">
                <input id="reference" type="number" min="0.01" step="any" value="1000">
                <span>units</span>
            </div>
            <p class="hint">Nodes at this distance from the camera keep their current scale.</p>
        </section>

        <section class="camera-section" aria-label="Camera selection">
            <label for="camera">Camera</label>
            <select id="camera">
                <option value="">— Select a Camera3D —</option>
            </select>
        </section>

        <section class="nodes-section">
            <div class="section-heading">
                <h2>Transform3D nodes</h2>
                <span id="node-count">0 nodes</span>
            </div>
            <div id="nodes" class="nodes" aria-live="polite">
                <p class="empty">Open a Fusion composition, select one or more Transform3D nodes, then scan.</p>
            </div>
        </section>

        <footer>
            <p id="status" role="status">Fusion connection pending.</p>
            <div class="actions">
                <button id="restore" class="secondary" disabled>Restore original</button>
                <button id="apply" class="primary" disabled>Apply correction</button>
            </div>
        </footer>
    </main>
    <script src="js/renderer.js"></script>
</body>
</html>
