name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WorkflowIntegration.node is proprietary and must be supplied by the
      # local Resolve SDK. It is intentionally excluded from CI artifacts.
      - name: Validate JavaScript syntax and repository structure
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build release archives
        run: npm run package

      - name: Upload plugin archives (${{ matrix.os }})
        uses: actions/upload-artifact@v7
        with:
          name: DepthCorrect-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  verify-archives:
    name: Verify Archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DepthCorrect-*
          path: artifacts
          merge-multiple: true

      - name: Verify archive contents
        run: |
          python -c "
          from zipfile import ZipFile
          from pathlib import Path
          import sys

          required_plugins = ['com.depthcorrect.zscale.ae', 'com.depthcorrect.zscale.resolve']

          for zip_path in Path('artifacts').glob('*.zip'):
              print(f'Checking {zip_path.name}...')
              with ZipFile(zip_path) as z:
                  names = z.namelist()
                  matches = [plugin for plugin in required_plugins
                             if any(name.startswith(plugin + '/') for name in names)]
                  if len(matches) != 1:
                      print(f'  ERROR: Expected exactly one plugin, found {matches}')
                      sys.exit(1)
                  sdk_files = [name for name in names if name.endswith('WorkflowIntegration.node')]
                  if sdk_files:
                      print(f'  ERROR: Contains SDK binary: {sdk_files}')
                      sys.exit(1)
                  print(f'  OK: {len(names)} files, contains {matches[0]}, no SDK binary')
          print('All archives verified successfully.')
          "
