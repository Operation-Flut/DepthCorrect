name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check CMake
        run: cmake --version

      - name: Build native Resolve bridge
        shell: bash
        run: |
          set -e
          NATIVE_DIR="com.depthcorrect.zscale.resolve/native"
          BUILD_DIR="$NATIVE_DIR/build-ci"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cmake -S "$NATIVE_DIR" -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD_DIR" --config Release
          # Copy the built .node file to the platform directory.
          case "${{ matrix.os }}" in
            ubuntu-latest|macos-*)
              PLATFORM_DIR="$NATIVE_DIR/linux-x64"
              [ "${{ matrix.os }}" = "macos-latest" ] && PLATFORM_DIR="$NATIVE_DIR/macos-universal"
              ;;
            windows-latest)
              PLATFORM_DIR="$NATIVE_DIR/windows-x64"
              ;;
          esac
          mkdir -p "$PLATFORM_DIR"
          find "$BUILD_DIR" -name "*.node" -exec cp {} "$PLATFORM_DIR/" \;
          echo "Built native bridge for ${{ matrix.os }}:"
          ls -la "$PLATFORM_DIR"
        continue-on-error: true

      - name: Validate JavaScript syntax and repository structure
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build release archives
        run: npm run package

      - name: Upload plugin archives (${{ matrix.os }})
        uses: actions/upload-artifact@v7
        with:
          name: DepthCorrect-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  verify-archives:
    name: Verify Archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DepthCorrect-*
          path: artifacts
          merge-multiple: true

      - name: Verify archive contents
        run: |
          python -c "
          from zipfile import ZipFile
          from pathlib import Path
          import sys
          
          required_plugins = ['com.depthcorrect.zscale.ae', 'com.depthcorrect.zscale.resolve']
          excluded = {'WorkflowIntegration.node', '.DS_Store', 'Thumbs.db'}
          
          for zip_path in Path('artifacts').glob('*.zip'):
              print(f'Checking {zip_path.name}...')
              with ZipFile(zip_path) as z:
                  names = z.namelist()
                  # Check both plugins present
                  for plugin in required_plugins:
                      plugin_files = [n for n in names if n.startswith(plugin + '/')]
                      if not plugin_files:
                          print(f'  ERROR: Missing {plugin} files')
                          sys.exit(1)
                  # Check no SDK binary
                  sdk_files = [n for n in names if n.endswith('WorkflowIntegration.node')]
                  if sdk_files:
                      print(f'  ERROR: Contains SDK binary: {sdk_files}')
                      sys.exit(1)
                  print(f'  OK: {len(names)} files, both plugins present, no SDK binary')
          print('All archives verified successfully.')
          "