name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate scripts and repository structure
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build release archives
        run: npm run package

      - name: Upload plugin archives (${{ matrix.os }})
        uses: actions/upload-artifact@v7
        with:
          name: DepthCorrect-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  verify-archives:
    name: Verify Archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DepthCorrect-*
          path: artifacts
          merge-multiple: true

      - name: Verify archive contents
        run: |
          python -c "
          from zipfile import ZipFile
          from pathlib import Path
          import sys

          expected = {
              'DepthCorrect-after-effects.zip': 'com.depthcorrect.zscale.ae/',
              'DepthCorrect-resolve.zip': 'DepthCorrect/',
          }

          archives = list(Path('artifacts').glob('*.zip'))
          if not archives:
              print('ERROR: no archives found')
              sys.exit(1)

          for zip_path in archives:
              print(f'Checking {zip_path.name}...')
              with ZipFile(zip_path) as archive:
                  names = archive.namelist()
                  prefix = expected.get(zip_path.name)
                  if prefix is None or not any(name.startswith(prefix) for name in names):
                      print(f'  ERROR: unexpected archive layout: {zip_path.name}')
                      sys.exit(1)
                  print(f'  OK: {len(names)} files')
          print('All archives verified successfully.')
          "
