name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit
        working-directory: ${{ github.workspace }}

      - name: Validate JavaScript syntax and repository structure
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build release archives
        run: npm run package

      - name: Upload plugin archives (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: DepthCorrect-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  verify-archives:
    name: Verify Archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DepthCorrect-*
          path: artifacts
          merge-multiple: true

      - name: Verify archive contents
        run: |
          python -c "
          from zipfile import ZipFile
          from pathlib import Path
          import sys
          
          required_plugins = ['com.depthcorrect.zscale.ae', 'com.depthcorrect.zscale.resolve']
          excluded = {'WorkflowIntegration.node', '.DS_Store', 'Thumbs.db'}
          
          for zip_path in Path('artifacts').glob('*.zip'):
              print(f'Checking {zip_path.name}...')
              with ZipFile(zip_path) as z:
                  names = z.namelist()
                  # Check both plugins present
                  for plugin in required_plugins:
                      plugin_files = [n for n in names if n.startswith(plugin + '/')]
                      if not plugin_files:
                          print(f'  ERROR: Missing {plugin} files')
                          sys.exit(1)
                  # Check no SDK binary
                  sdk_files = [n for n in names if n.endswith('WorkflowIntegration.node')]
                  if sdk_files:
                      print(f'  ERROR: Contains SDK binary: {sdk_files}')
                      sys.exit(1)
                  print(f'  OK: {len(names)} files, both plugins present, no SDK binary')
          print('All archives verified successfully.')
          "