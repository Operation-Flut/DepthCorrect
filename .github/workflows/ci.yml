name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax and repository structure
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build release archives
        run: npm run package
      - name: Upload plugin archives
        uses: actions/upload-artifact@v7
        with:
          name: DepthCorrect-preview
          path: dist/*.zip
          if-no-files-found: error
