name: Lint & Format Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax
        run: |
          node --check com.depthcorrect.zscale.resolve/main.js || true
          node --check com.depthcorrect.zscale.resolve/package.js || true
      - name: Check HTML structure
        run: |
          grep -q '<!DOCTYPE html>' com.depthcorrect.zscale.resolve/index.html && echo "Resolve HTML OK"
          grep -q '<!DOCTYPE html>' com.depthcorrect.zscale/index.html && echo "AE HTML OK"
