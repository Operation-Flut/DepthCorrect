name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0). If empty, uses package.json version prefixed with "v".'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release tag
        id: resolve-tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Build release archives (ZIP & ZXP)
        run: |
          npm run check
          npm test
          npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag }}
          name: DepthCorrect ${{ steps.resolve-tag.outputs.tag }}
          files: |
            dist/*.zip
            dist/*.zxp
            scripts/installer.lua
          generate_release_notes: true