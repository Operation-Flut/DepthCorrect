name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0). If empty, uses package.json version prefixed with "v".'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve release tag
        id: resolve-tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"
      - name: Build native Resolve bridge
        uses: threeal/cmake-action@v2.1.0
        with:
          source-dir: com.depthcorrect.zscale.resolve/native
          build-dir: com.depthcorrect.zscale.resolve/native/build-ci
          options: |
            CMAKE_BUILD_TYPE=Release
          build-args: --config Release
        continue-on-error: true

      - name: Stage native Resolve bridge
        shell: bash
        run: |
          set -e
          NATIVE_DIR="com.depthcorrect.zscale.resolve/native"
          BUILD_DIR="$NATIVE_DIR/build-ci"
          PLATFORM_DIR="$NATIVE_DIR/linux-x64"
          mkdir -p "$PLATFORM_DIR"
          find "$BUILD_DIR" -name "*.node" -exec cp {} "$PLATFORM_DIR/" \;
          echo "Staged native bridge:"
          ls -la "$PLATFORM_DIR"
        continue-on-error: true

      - name: Validate and test
        run: |
          npm run check
          npm test
          npm run package
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag }}
          name: DepthCorrect ${{ steps.resolve-tag.outputs.tag }}
          files: |
            dist/*.zip
            README.md
            LICENSE
            CHANGELOG.md
          generate_release_notes: true
